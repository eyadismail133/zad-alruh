name: zad_alruh
description: "Zad Alruh - Islamic Spiritual Companion"
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  timezone: 0.11.1
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.4
  path: ^1.9.1
  crypto: 3.0.7
  xml: 7.0.1
  url_launcher: 6.3.2
  adhan:
    path: third_party/adhan
  hijri: 3.0.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.3
  fake_async: 1.3.3
  url_launcher_platform_interface: 2.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/branding/logo.png
    - assets/fonts/Amiri-OFL.txt
    - assets/fonts/IBM-Plex-LICENSE.txt
    - assets/licenses/Adhan-MIT.txt
    - assets/licenses/Hijri-BSD.txt
    - assets/content/manifest.json
    - assets/content/quran/quran-uthmani.txt
    - assets/content/quran/quran-data.xml
    - assets/content/quran/kfqc-page-bounds.json
    - assets/content/quran/quran-pages-digests.json
    - assets/content/quran/pages/
    - assets/content/cities/cities15000.txt
    - assets/content/cities/GEONAMES-LICENSE-README.txt
    - assets/content/hadith/hadith-enc-sahih.json
    - assets/content/hisn/hisn-muslim.json
    - assets/audio/adhan/

  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBM-Plex-Sans-Arabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM-Plex-Sans-Arabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBM-Plex-Sans-Arabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBM-Plex-Sans-Arabic-Bold.ttf
          weight: 700
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/Amiri-Quran-Regular.ttf
          weight: 400
