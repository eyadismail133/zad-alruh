name: Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Read app version
        id: ver
        run: |
          v=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install packages
        shell: bash
        run: |
          set -o pipefail
          if ! flutter pub get 2>&1 | tee pub-get.txt; then
            tail -40 pub-get.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=pub get failed::/'
            echo
            exit 1
          fi

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt; then
            grep -E "^\s*error " analyze.txt | head -40 | while IFS= read -r line; do echo "::error title=analyze::$line"; done
            exit 1
          fi

      - name: Content integrity (development gate)
        run: dart run tool/validate_content.dart --development

      - name: Unit & widget tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test --concurrency 2 --reporter github --file-reporter json:test-results.json 2>&1 | tee test-output.txt

      - name: Annotate failing tests
        if: steps.tests.outcome != 'success'
        run: python3 tool/ci_test_annotations.py test-results.json

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zad-release.jks"
            echo "ZAD_KEYSTORE_PATH=$RUNNER_TEMP/zad-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — APK will be signed with a throwaway debug key. See docs/ANDROID-SIGNING.ar.md"
          fi

      - name: Build split APKs (per CPU)
        env:
          ZAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Collect split APKs
        run: |
          mkdir -p out
          v=${{ steps.ver.outputs.version }}
          for abi in arm64-v8a armeabi-v7a; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "out/zad-alruh-$v-$abi.apk"
          done

      - name: Build universal APK
        env:
          ZAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "out/zad-alruh-${{ steps.ver.outputs.version }}-universal.apk"

      - name: Checksums & summary
        run: |
          cd out
          sha256sum *.apk > SHA256SUMS.txt
          {
            echo "## زادُ الروح ${{ steps.ver.outputs.version }}"
            echo
            echo "| الملف | الحجم |"
            echo "|---|---|"
            for f in *.apk; do echo "| $f | $(du -h "$f" | cut -f1) |"; done
            echo
            echo "Tests: **${{ steps.tests.outcome }}**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Tests::outcome=${{ steps.tests.outcome }}"
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo '### Failing tests (tail)' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "FAILED|\[E\]|Error:" ../test-output.txt | tail -60 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zad-alruh-${{ steps.ver.outputs.version }}-apk
          path: out/*
          retention-days: 30

      - name: Publish GitHub Release
        # Every push to main (and every v* tag) publishes/updates the release
        # for the version in pubspec.yaml, so there is always a stable
        # download link: /releases/latest
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: زادُ الروح v${{ steps.ver.outputs.version }}
          make_latest: true
          overwrite_files: true
          files: out/*
          body: |
            ### التحميل
            - **أغلب الموبايلات:** `zad-alruh-${{ steps.ver.outputs.version }}-arm64-v8a.apk`
            - **موبايل قديم:** `armeabi-v7a`
            - **مش متأكد؟** نزّل `universal` (أكبر شوية ويشتغل على أي موبايل)

            فعّل "التثبيت من مصادر غير معروفة" لو الموبايل طلب ده.
